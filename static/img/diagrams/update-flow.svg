<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-label="组件更新成功与失败的流程">
<title>组件更新成功与失败的流程</title><desc>停止旧版本后复制受管数据库，在副本上启动并准备新版本。提交前失败时丢弃候选并恢复旧版本和原数据库；成功时提交新代次，旧代次保留。</desc>
<defs><marker id="update-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ifm-color-primary,#0e7c92)"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--alona-ink,#1f2a44)}
.label{font-size:19px;font-weight:600}.detail{font-size:16px;fill:var(--alona-muted,#5e6b82)}
.node{fill:var(--alona-surface,#fff);stroke:var(--alona-line,#dfe5ec);stroke-width:1.5}
.core{fill:var(--ifm-code-background,#eaf0f5);stroke:var(--ifm-color-primary,#0e7c92);stroke-width:1.5}
.success{fill:var(--alona-surface,#fff);stroke:var(--ifm-color-primary,#0e7c92);stroke-width:2}
.edge{fill:none;stroke:var(--ifm-color-primary,#0e7c92);stroke-width:2}.guide{stroke:var(--alona-line,#dfe5ec);stroke-width:1.5;stroke-dasharray:5 6}
</style>
<rect class="node" x="200" y="15" width="320" height="58" rx="12"/><text x="360" y="50" class="label" text-anchor="middle">停止旧版本</text><path class="edge" d="M 360 73 V 105" marker-end="url(#update-flow-arrow)"/><rect class="node" x="200" y="108" width="320" height="65" rx="12"/><text x="360" y="133.5" class="label" text-anchor="middle">复制受管数据库</text><text x="360" y="159.5" class="detail" text-anchor="middle">新版本在副本上工作</text><path class="edge" d="M 360 173 V 205" marker-end="url(#update-flow-arrow)"/><rect class="core" x="200" y="208" width="320" height="70" rx="12"/><text x="360" y="236" class="label" text-anchor="middle">准备新版本</text><text x="360" y="262" class="detail" text-anchor="middle">配置 → 迁移 → OnStart → 登记</text><path class="edge" d="M 260 278 V 323 H 175 V 365" marker-end="url(#update-flow-arrow)"/><text x="95" y="345" class="detail" text-anchor="middle">准备成功</text><path class="edge" d="M 460 278 V 323 H 550 V 365" marker-end="url(#update-flow-arrow)"/><text x="625" y="345" class="detail" text-anchor="middle">提交前失败</text><rect class="success" x="20" y="368" width="310" height="106" rx="12"/><text x="175" y="401" class="label" text-anchor="middle">提交新代次</text><text x="175" y="427" class="detail" text-anchor="middle">新版本开始接收消息</text><text x="175" y="453" class="detail" text-anchor="middle">旧代次暂时保留</text><rect class="node" x="390" y="368" width="310" height="106" rx="12"/><text x="545" y="401" class="label" text-anchor="middle">恢复旧版本</text><text x="545" y="427" class="detail" text-anchor="middle">丢弃候选数据库副本</text><text x="545" y="453" class="detail" text-anchor="middle">使用原数据库</text>
</svg>
