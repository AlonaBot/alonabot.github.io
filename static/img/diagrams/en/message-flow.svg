<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" role="img" aria-label="Command processing flow">
<title>Command processing flow</title><desc>The Adapter converts a user command. Core runs Hooks, matches commands, checks permissions, and invokes the Handler. The plugin replies through Core and the Adapter.</desc>
<defs><marker id="message-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ifm-color-primary,#0e7c92)"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--alona-ink,#1f2a44)}
.label{font-size:19px;font-weight:600}.detail{font-size:14px;fill:var(--alona-muted,#5e6b82)}
.node{fill:var(--alona-surface,#fff);stroke:var(--alona-line,#dfe5ec);stroke-width:1.5}
.core{fill:var(--ifm-code-background,#eaf0f5);stroke:var(--ifm-color-primary,#0e7c92);stroke-width:1.5}
.success{fill:var(--alona-surface,#fff);stroke:var(--ifm-color-primary,#0e7c92);stroke-width:2}
.edge{fill:none;stroke:var(--ifm-color-primary,#0e7c92);stroke-width:2}.guide{stroke:var(--alona-line,#dfe5ec);stroke-width:1.5;stroke-dasharray:5 6}
</style>
<rect class="node" x="12" y="16" width="136" height="52" rx="12"/><text x="80" y="48" class="label" text-anchor="middle">User</text><path class="guide" d="M 80 68 V 584"/><rect class="node" x="197" y="16" width="136" height="52" rx="12"/><text x="265" y="48" class="label" text-anchor="middle">Adapter</text><path class="guide" d="M 265 68 V 584"/><rect class="node" x="382" y="16" width="136" height="52" rx="12"/><text x="450" y="48" class="label" text-anchor="middle">Core</text><path class="guide" d="M 450 68 V 584"/><rect class="node" x="567" y="16" width="136" height="52" rx="12"/><text x="635" y="48" class="label" text-anchor="middle">Plugin</text><path class="guide" d="M 635 68 V 584"/><path class="edge" d="M 80 110 H 265" marker-end="url(#message-flow-arrow)"/><text x="172" y="96" class="detail" text-anchor="middle">/todo add buy milk</text><path class="edge" d="M 265 164 H 450" marker-end="url(#message-flow-arrow)"/><text x="357" y="149" class="detail" text-anchor="middle">Unified message</text><rect class="core" x="367" y="194" width="166" height="93" rx="12"/><text x="450" y="220.5" class="label" text-anchor="middle">Hook</text><text x="450" y="246.5" class="detail" text-anchor="middle">Command matching</text><text x="450" y="272.5" class="detail" text-anchor="middle">Permission check</text><path class="edge" d="M 450 330 H 635" marker-end="url(#message-flow-arrow)"/><text x="542" y="315" class="detail" text-anchor="middle">Invoke Handler</text><path class="edge" d="M 635 389 H 450" marker-end="url(#message-flow-arrow)"/><text x="542" y="374" class="detail" text-anchor="middle">c.Reply</text><rect class="core" x="377" y="420" width="146" height="48" rx="12"/><text x="450" y="450" class="label" text-anchor="middle">Send checks</text><path class="edge" d="M 450 507 H 265" marker-end="url(#message-flow-arrow)"/><text x="357" y="492" class="detail" text-anchor="middle">Send request</text><path class="edge" d="M 265 566 H 80" marker-end="url(#message-flow-arrow)"/><text x="172" y="551" class="detail" text-anchor="middle">Platform reply</text>
</svg>
