<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Core 与组件的关系">
<title>Core 与组件的关系</title><desc>聊天平台通过 Adapter 连接 Core。Core 管理插件和 Agent，通过管理 API 向 WebUI 提供数据。Native 组件缺省独立运行。</desc>
<defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ifm-color-primary,#0e7c92)"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--alona-ink,#1f2a44)}
.label{font-size:19px;font-weight:600}.detail{font-size:16px;fill:var(--alona-muted,#5e6b82)}
.node{fill:var(--alona-surface,#fff);stroke:var(--alona-line,#dfe5ec);stroke-width:1.5}
.core{fill:var(--ifm-code-background,#eaf0f5);stroke:var(--ifm-color-primary,#0e7c92);stroke-width:1.5}
.success{fill:var(--alona-surface,#fff);stroke:var(--ifm-color-primary,#0e7c92);stroke-width:2}
.edge{fill:none;stroke:var(--ifm-color-primary,#0e7c92);stroke-width:2}.guide{stroke:var(--alona-line,#dfe5ec);stroke-width:1.5;stroke-dasharray:5 6}
</style>
<rect class="node" x="220" y="18" width="280" height="58" rx="12"/><text x="360" y="53" class="label" text-anchor="middle">Telegram、QQ 等平台</text><path class="edge" d="M 360 76 V 111" marker-end="url(#architecture-arrow)"/><rect class="node" x="250" y="114" width="220" height="58" rx="12"/><text x="360" y="149" class="label" text-anchor="middle">Adapter 进程</text><path class="edge" d="M 360 172 V 207" marker-end="url(#architecture-arrow)"/><rect class="core" x="170" y="210" width="380" height="105" rx="12"/><text x="360" y="242.5" class="label" text-anchor="middle">Core</text><text x="360" y="268.5" class="detail" text-anchor="middle">路由与权限 · 消息与媒体</text><text x="360" y="294.5" class="detail" text-anchor="middle">定时任务 · HTTP · 配置与更新</text><path class="edge" d="M 270 315 V 350 H 140 V 388" marker-end="url(#architecture-arrow)"/><path class="edge" d="M 360 315 V 388" marker-end="url(#architecture-arrow)"/><path class="edge" d="M 450 315 V 350 H 580 V 388" marker-end="url(#architecture-arrow)"/><rect class="node" x="30" y="391" width="220" height="62" rx="12"/><text x="140" y="428" class="label" text-anchor="middle">插件进程 A</text><rect class="node" x="270" y="391" width="180" height="62" rx="12"/><text x="360" y="428" class="label" text-anchor="middle">插件进程 B</text><rect class="node" x="480" y="391" width="200" height="62" rx="12"/><text x="580" y="428" class="label" text-anchor="middle">Agent 进程</text><rect class="node" x="565" y="221" width="145" height="75" rx="12"/><text x="637.5" y="251.5" class="label" text-anchor="middle">WebUI</text><text x="637.5" y="277.5" class="detail" text-anchor="middle">Go 后台 + 网页</text><path class="edge" d="M 565 258 H 551" marker-end="url(#architecture-arrow)"/><text x="628" y="207" class="detail" text-anchor="middle">管理 API</text>
</svg>
