<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-label="Component update and recovery">
<title>Component update and recovery</title><desc>Stop the old version and copy the managed database. Prepare the candidate against the copy. Commit success or restore the previous generation after a pre-commit failure.</desc>
<defs><marker id="update-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ifm-color-primary,#0e7c92)"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--alona-ink,#1f2a44)}
.label{font-size:19px;font-weight:600}.detail{font-size:16px;fill:var(--alona-muted,#5e6b82)}
.node{fill:var(--alona-surface,#fff);stroke:var(--alona-line,#dfe5ec);stroke-width:1.5}
.core{fill:var(--ifm-code-background,#eaf0f5);stroke:var(--ifm-color-primary,#0e7c92);stroke-width:1.5}
.success{fill:var(--alona-surface,#fff);stroke:var(--ifm-color-primary,#0e7c92);stroke-width:2}
.edge{fill:none;stroke:var(--ifm-color-primary,#0e7c92);stroke-width:2}.guide{stroke:var(--alona-line,#dfe5ec);stroke-width:1.5;stroke-dasharray:5 6}
</style>
<rect class="node" x="200" y="15" width="320" height="58" rx="12"/><text x="360" y="50" class="label" text-anchor="middle">Stop old version</text><path class="edge" d="M 360 73 V 105" marker-end="url(#update-flow-arrow)"/><rect class="node" x="200" y="108" width="320" height="65" rx="12"/><text x="360" y="133.5" class="label" text-anchor="middle">Copy managed database</text><text x="360" y="159.5" class="detail" text-anchor="middle">Candidate uses the copy</text><path class="edge" d="M 360 173 V 205" marker-end="url(#update-flow-arrow)"/><rect class="core" x="200" y="208" width="320" height="70" rx="12"/><text x="360" y="236" class="label" text-anchor="middle">Prepare candidate</text><text x="360" y="262" class="detail" text-anchor="middle">Config → Migrate → Start → Register</text><path class="edge" d="M 260 278 V 323 H 175 V 365" marker-end="url(#update-flow-arrow)"/><text x="95" y="345" class="detail" text-anchor="middle">Ready</text><path class="edge" d="M 460 278 V 323 H 550 V 365" marker-end="url(#update-flow-arrow)"/><text x="625" y="345" class="detail" text-anchor="middle">Failed</text><rect class="success" x="20" y="368" width="310" height="106" rx="12"/><text x="175" y="401" class="label" text-anchor="middle">Commit generation</text><text x="175" y="427" class="detail" text-anchor="middle">Activate new version</text><text x="175" y="453" class="detail" text-anchor="middle">Retain previous generation</text><rect class="node" x="390" y="368" width="310" height="106" rx="12"/><text x="545" y="401" class="label" text-anchor="middle">Restore old version</text><text x="545" y="427" class="detail" text-anchor="middle">Discard candidate copy</text><text x="545" y="453" class="detail" text-anchor="middle">Use original database</text>
</svg>
