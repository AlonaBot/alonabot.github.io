<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 145" role="img" aria-label="Frame byte layout">
<title>Frame byte layout</title><desc>A four-byte big-endian unsigned length precedes the Protobuf payload. Length excludes its own field; payload size is at most 4 MiB.</desc>
<defs><marker id="wire-frame-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ifm-color-primary,#0e7c92)"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:var(--alona-ink,#1f2a44)}
.label{font-size:19px;font-weight:600}.detail{font-size:16px;fill:var(--alona-muted,#5e6b82)}
.node{fill:var(--alona-surface,#fff);stroke:var(--alona-line,#dfe5ec);stroke-width:1.5}
.core{fill:var(--ifm-code-background,#eaf0f5);stroke:var(--ifm-color-primary,#0e7c92);stroke-width:1.5}
.success{fill:var(--alona-surface,#fff);stroke:var(--ifm-color-primary,#0e7c92);stroke-width:2}
.edge{fill:none;stroke:var(--ifm-color-primary,#0e7c92);stroke-width:2}.guide{stroke:var(--alona-line,#dfe5ec);stroke-width:1.5;stroke-dasharray:5 6}
</style>
<rect class="core" x="20" y="25" width="190" height="95" rx="10"/><rect class="node" x="220" y="25" width="480" height="95" rx="10"/><text x="115" y="65" class="label" text-anchor="middle">Length</text><text x="115" y="94" class="detail" text-anchor="middle">4 bytes · big-endian</text><text x="460" y="65" class="label" text-anchor="middle">Payload</text><text x="460" y="94" class="detail" text-anchor="middle">Protobuf encoding</text>
</svg>
